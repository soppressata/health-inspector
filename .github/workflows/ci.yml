name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.7'
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -sSfL "${base}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          file /tmp/actionlint.tar.gz | grep -qi 'gzip\|tar'
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version
      - name: actionlint (actionlint)
        run: actionlint -color
      - name: node --check all src + bin files
        run: |
          for f in src/*.js bin/*.js; do node --check "$f"; done
      - run: npm test
      - name: CLI smoke test (offline JSON)
        run: |
          npx --no-install health-inspector . --offline --format json > smoke.json
          node -e "const o=JSON.parse(require('fs').readFileSync('smoke.json','utf8')); if(typeof o.findingsCount!=='number') throw new Error('missing findingsCount'); console.log('smoke ok:', o.findingsCount, 'findings,', o.candidatesCount, 'candidates')"
      - run: npm run build
      - name: Verify dist/ is in sync with src/
        run: git diff --exit-code -- dist/
