name: Acceptance

on:
  push:
    branches: [main]

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Install actionlint
        run: |
          set -e
          url=$(curl -sSL https://api.github.com/repos/rhysd/actionlint/releases/latest \
            | grep "browser_download_url.*linux_amd64\.tar\.gz" | head -1 | cut -d '"' -f 4)
          curl -sSL "$url" -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp
          /tmp/actionlint --version
      - name: actionlint (action.yml + workflows)
        run: /tmp/actionlint
      - name: node --check all src + bin files
        run: |
          for f in src/*.js bin/*.js; do node --check "$f"; done
      - run: npm test
      - run: npm run build
      - name: Verify dist/ is in sync with src/
        run: git diff --exit-code -- dist/
      - name: CLI acceptance (exit code 0 or 1, valid JSON)
        run: |
          set +e
          node bin/health-inspector.js . --offline --format json > /tmp/acc.json 2>/tmp/acc.err
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::error::CLI exited with unexpected code $code"
            cat /tmp/acc.err
            exit 1
          fi
          node -e "JSON.parse(require('fs').readFileSync('/tmp/acc.json','utf8'))" \
            || { echo "::error::CLI output is not valid JSON"; exit 1; }
          echo "CLI acceptance passed (exit $code)"
          rm -rf .health-inspector
