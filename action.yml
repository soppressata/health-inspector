name: 'Health Inspector'
description: 'Shows up unannounced, does a deep audit of your repo, and files a report only when it finds real violations.'
author: soppressata

inputs:
  api-key:
    description: 'LLM API key (e.g. DeepSeek).'
    required: true
  provider:
    description: 'LLM provider: openai (default), claude, kimi, hermes, opencode.'
    required: false
    default: 'openai'
  base-url:
    description: 'Base URL of the OpenAI-compatible chat completions API.'
    required: false
    default: 'https://api.deepseek.com'
  model:
    description: 'Model to use for the inspection report.'
    required: false
    default: 'deepseek-chat'
  probability:
    description: 'Chance (0-1) that this run actually executes, so scheduled runs feel unannounced.'
    required: false
    default: '1.0'
  paths:
    description: 'Glob or directory to scan.'
    required: false
    default: '.'
  scan-paths:
    description: 'Space-separated list of paths to scan (defaults to paths input).'
    required: false
    default: '.'
  rules:
    description: 'Comma-separated list of rule names to enable (defaults to all).'
    required: false
  exclude-rules:
    description: 'Comma-separated list of rule names to exclude.'
    required: false
  oversized-lines:
    description: 'Positive integer line threshold for oversized functions.'
    required: false
    default: '80'
  max-candidates:
    description: 'Maximum number of scan candidates to pass to the model.'
    required: false
    default: '15'
  label:
    description: 'Label used for filed issue reports.'
    required: false
    default: 'health-inspector'
  state-branch:
    description: 'Branch used to persist state (last-scanned ref, filed fingerprints).'
    required: false
    default: 'health-inspector-state'
  github-token:
    description: 'GitHub token used to authenticate REST API calls.'
    required: false
    default: ${{ github.token }}
  github-request-timeout-ms:
    description: 'Per-request timeout (ms) for GitHub REST API calls.'
    required: false
    default: '15000'
  github-max-retries:
    description: 'Maximum number of retries for transient GitHub API failures.'
    required: false
    default: '3'
  webhook-url:
    description: 'Optional HTTPS endpoint to notify when new findings are reported.'
    required: false
  webhook-headers:
    description: 'Optional JSON object of additional webhook headers.'
    required: false
  webhook-secret:
    description: 'Optional secret value sent in the webhook secret header.'
    required: false
  webhook-secret-header:
    description: 'Header name used for webhook-secret.'
    required: false
    default: 'X-Health-Inspector-Secret'
  webhook-timeout-ms:
    description: 'Webhook request timeout in milliseconds.'
    required: false
    default: '5000'
  webhook-retries:
    description: 'Number of retries for transient webhook failures.'
    required: false
    default: '3'
  webhook-signing-secret:
    description: 'Optional HMAC-SHA256 signing secret for webhook payloads.'
    required: false
  webhook-signature-header:
    description: 'Header name used to deliver the HMAC-SHA256 webhook signature.'
    required: false
    default: 'X-Health-Inspector-Signature'

outputs:
  findings-count:
    description: 'Number of confirmed findings reported.'
  report-url:
    description: 'URL of the filed issue report, if any.'
  webhook-delivered:
    description: 'Whether a findings webhook was delivered.'
  webhook-delivery-id:
    description: 'Delivery ID for the fired findings webhook (empty if no webhook was sent).'

runs:
  using: node20
  main: dist/index.js
